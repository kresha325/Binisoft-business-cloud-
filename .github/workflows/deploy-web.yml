name: Flutter Web — Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform scaffolding
        run: flutter create --project-name binisoft_business_cloud --platforms=web,android,ios .
      # Flutter create generates a sample widget test referencing MyApp,
      # but this project uses BinisoftApp. Remove that unrelated scaffold test.
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze (warnings and errors remain fatal)
        # Current Flutter SDK emits informational deprecated_member_use diagnostics
        # for framework Material imports; don't block deployment on info-level notices.
        run: flutter analyze --no-fatal-infos
      - name: Build Flutter web
        run: flutter build web --release --base-href /Binisoft-business-cloud-/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
